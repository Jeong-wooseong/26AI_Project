# 로컬 개발용 MySQL. MySQL 을 직접 설치했다면 쓰지 않아도 된다.
#   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: replyboss-mysql
    environment:
      MYSQL_DATABASE: replyboss
      MYSQL_USER: replyboss
      MYSQL_PASSWORD: replyboss
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - replyboss-mysql:/var/lib/mysql

volumes:
  replyboss-mysql:
