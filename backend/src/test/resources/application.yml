spring:
  datasource:
    url: jdbc:h2:mem:replyboss;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

openai:
  api-key: test-key
  base-url: http://localhost:0
  classify-model: test-classify-model
  generate-model: test-generate-model
  embedding-model: test-embedding-model
  reasoning-effort:
  classify-reasoning-effort: low
  timeout-seconds: 1
  max-retries: 0

similarity:
  dimensions: 4
  review-group-threshold: 0.9
  reply-threshold: 0.9
  max-regenerations: 2
  compare-count: 30
  review-group-days: 7

replyboss:
  app-url: http://localhost:5173
  remember-me-key: test-remember-key
  secure-cookies: false
  upload-dir: ./build/test-uploads
  admin-emails: admin2@test.com
  mail:
    host: smtp.test
    port: 587
    username: test@test.com
    password: test-password
    from: test@test.com
