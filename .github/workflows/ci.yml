name: CI

on:
  push:
    branches: [main, "week*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: 빌드와 테스트 (H2, LLM 은 가짜로 대체)
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: 실패한 테스트 요약 (어노테이션으로 표시)
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('build/test-results/test/*.xml'):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.iter('failure')) + list(case.iter('error')):
                      text = (bad.get('message') or '') + ' | ' + (bad.text or '')[:1500]
                      text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
      - name: bootRunLocal 태스크 설정 확인 (실행하지 않음)
        run: ./gradlew bootRunLocal --dry-run --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
